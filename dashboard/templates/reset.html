<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password – TraceQube</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/css/main.css"/>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-mark"><svg viewBox="0 0 15 15"><polyline points="2,12 5.5,5 9,9 12,5"/></svg></div>
      Trace<em>Qube</em>
    </div>
    <div class="auth-subtitle">Set a new password</div>
    <div id="alertBox"></div>
    <div class="form-group">
      <label class="form-label">New Password</label>
      <input class="input" type="password" id="password" placeholder="Min 8 characters"/>
    </div>
    <div class="form-group">
      <label class="form-label">Confirm Password</label>
      <input class="input" type="password" id="confirm" placeholder="Repeat password"/>
    </div>
    <button class="btn btn-primary" style="width:100%;margin-top:8px" onclick="submit()">Reset Password</button>
  </div>
</div>
<script>
const API = "https://api.traceqube.com";
var token = new URLSearchParams(window.location.search).get("token");
async function submit() {
  var pass = document.getElementById("password").value;
  var conf = document.getElementById("confirm").value;
  var box = document.getElementById("alertBox");
  if (pass !== conf) { box.innerHTML = '<div class="alert alert-error">Passwords do not match</div>'; return; }
  if (pass.length < 8) { box.innerHTML = '<div class="alert alert-error">Password must be at least 8 characters</div>'; return; }
  var btn = document.querySelector(".btn-primary");
  btn.innerHTML = '<span class="spinner"></span> Resetting'; btn.disabled = true;
  var res = await fetch(API+"/api/reset-password", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,password:pass})});
  var data = await res.json();
  btn.textContent = "Reset Password"; btn.disabled = false;
  if (data.error) { box.innerHTML = `<div class="alert alert-error">${data.error}</div>`; return; }
  box.innerHTML = '<div class="alert alert-success">Password reset! Redirecting to login...</div>';
  setTimeout(() => window.location.href = "/", 2000);
}
var saved = localStorage.getItem("tq-theme") || "dark";
document.documentElement.setAttribute("data-theme", saved);
</script>
</body>
</html>
