<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Panel – TraceQube</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/css/main.css"/>
</head>
<body>
<div class="dash-layout">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-mark"><svg viewBox="0 0 11 11"><polyline points="1,9 4,4 7,6.5 9.5,3"/></svg></div>
      Trace<em>Qube</em>
      <span style="font-size:0.6rem;color:var(--accent);background:var(--accent-dim);border:1px solid rgba(74,222,128,0.2);padding:1px 7px;border-radius:100px;font-weight:700;font-family:'Geist Mono',monospace;letter-spacing:0.05em;margin-left:4px">ADMIN</span>
    </div>
    <nav>
      <button class="nav-item active" id="navStats" onclick="showSection('stats')">
        <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        Stats
      </button>
      <button class="nav-item" id="navUsers" onclick="showSection('users')">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Users
      </button>
      <a href="/dashboard" class="nav-item">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        Dashboard
      </a>
    </nav>
    <div class="sidebar-bottom">
      <button class="nav-item" onclick="logout()">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Logout
      </button>
    </div>
  </aside>

  <div class="dash-main">
    <div class="dash-header">
      <div class="dash-header-left">
        <div class="dash-title" id="pageTitle">Stats</div>
      </div>
      <div class="dash-header-right">
        <button class="theme-btn" id="themeBtn">🌤</button>
      </div>
    </div>

    <div class="dash-content">
      <div id="alertBox"></div>

      <!-- STATS -->
      <div id="sectionStats">
        <div class="stats-grid" id="statsGrid">
          <div class="stat-card"><div class="stat-label">Loading</div><div class="stat-value" style="font-size:1.2rem;color:var(--muted)">...</div></div>
        </div>
      </div>

      <!-- USERS -->
      <div id="sectionUsers" style="display:none">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px">
          <div style="font-size:0.875rem;font-weight:700;color:var(--text)">All Users</div>
          <input class="input" id="searchInput" placeholder="Search by email..." style="max-width:240px;padding:7px 12px;font-size:0.82rem" oninput="filterUsers()"/>
        </div>
        <div class="card" style="padding:0;overflow:hidden">
          <div style="overflow-x:auto">
            <table class="table" id="usersTable">
              <thead>
                <tr>
                  <th>Email</th>
                  <th>Plan</th>
                  <th>Usage</th>
                  <th>Verified</th>
                  <th>Joined</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="usersBody">
                <tr><td colspan="6" style="text-align:center;color:var(--muted);padding:32px">Loading users...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const API = "https://api.traceqube.com";
var token = localStorage.getItem("tq_token");
var allUsers = [];
if (!token) window.location.href = "/";

var saved = localStorage.getItem("tq-theme") || "dark";
document.documentElement.setAttribute("data-theme", saved);
var tb = document.getElementById("themeBtn");
tb.textContent = saved === "dark" ? "🌤" : "🌙";
tb.addEventListener("click", () => {
  var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem("tq-theme", next);
  tb.textContent = next === "dark" ? "🌤" : "🌙";
});

function showAlert(msg, type) {
  var box = document.getElementById("alertBox");
  box.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
  setTimeout(() => box.innerHTML = "", 4000);
}
function logout() { localStorage.clear(); window.location.href = "/"; }

function showSection(sec) {
  ["stats","users"].forEach(s => {
    var el = document.getElementById("section" + s.charAt(0).toUpperCase() + s.slice(1));
    if (el) el.style.display = s === sec ? "block" : "none";
    var nav = document.getElementById("nav" + s.charAt(0).toUpperCase() + s.slice(1));
    if (nav) nav.className = "nav-item" + (s === sec ? " active" : "");
  });
  var titles = {stats:"Stats", users:"Users"};
  document.getElementById("pageTitle").textContent = titles[sec];
  if (sec === "users" && allUsers.length === 0) loadUsers();
}

async function loadStats() {
  var res = await fetch(API+"/api/admin/stats", {headers:{Authorization:"Bearer "+token}});
  var data = await res.json();
  if (data.error) { if (res.status === 403) window.location.href = "/dashboard"; return; }
  var grid = document.getElementById("statsGrid");
  var items = [
    ["Total Users", data.totalUsers],
    ["Pro Users", data.proUsers],
    ["Enterprise Users", data.enterpriseUsers],
    ["Requests Today", data.requestsToday],
    ["Total Requests", data.totalRequests],
  ];
  grid.innerHTML = items.map(([l,v]) => `
    <div class="stat-card">
      <div class="stat-label">${l}</div>
      <div class="stat-value">${(v||0).toLocaleString()}</div>
    </div>`).join('');
}

async function loadUsers() {
  var res = await fetch(API+"/api/admin/users", {headers:{Authorization:"Bearer "+token}});
  var data = await res.json();
  if (data.error) return;
  allUsers = data.users || [];
  renderUsers(allUsers);
}

function renderUsers(users) {
  var tbody = document.getElementById("usersBody");
  if (!users.length) { tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:32px">No users found</td></tr>'; return; }
  tbody.innerHTML = users.map(u => `
    <tr>
      <td style="color:var(--text);font-size:0.82rem">${u.email}</td>
      <td>
        <span class="plan-badge ${u.plan}">${u.plan}</span>
        <select class="plan-select" style="margin-left:8px" onchange="changePlan(${u.id}, this.value)">
          <option value="free" ${u.plan==="free"?"selected":""}>Free</option>
          <option value="pro" ${u.plan==="pro"?"selected":""}>Pro</option>
          <option value="enterprise" ${u.plan==="enterprise"?"selected":""}>Enterprise</option>
        </select>
      </td>
      <td style="font-family:'Geist Mono',monospace;font-size:0.75rem;color:var(--text2)">${u.usageToday||0} / ${u.dailyLimit||50}</td>
      <td>${u.isVerified ? '<span style="color:var(--accent);font-size:0.78rem">✓ Yes</span>' : '<span style="color:var(--muted);font-size:0.78rem">No</span>'}</td>
      <td style="font-family:'Geist Mono',monospace;font-size:0.72rem;color:var(--muted)">${u.createdAt ? new Date(u.createdAt).toLocaleDateString() : '—'}</td>
      <td>
        <button class="btn btn-danger btn-xs" onclick="deleteUser(${u.id}, '${u.email}')">Delete</button>
      </td>
    </tr>`).join('');
}

function filterUsers() {
  var q = document.getElementById("searchInput").value.toLowerCase();
  renderUsers(allUsers.filter(u => u.email.toLowerCase().includes(q)));
}

async function changePlan(id, plan) {
  var res = await fetch(API+"/api/admin/users/"+id+"/plan", {method:"PUT",headers:{Authorization:"Bearer "+token,"Content-Type":"application/json"},body:JSON.stringify({plan})});
  var data = await res.json();
  if (data.error) showAlert(data.error, "error");
  else { showAlert("Plan updated to " + plan, "success"); var u = allUsers.find(u=>u.id===id); if(u) u.plan=plan; }
}

async function deleteUser(id, email) {
  if (!confirm("Delete user " + email + "? This cannot be undone.")) return;
  var res = await fetch(API+"/api/admin/users/"+id, {method:"DELETE",headers:{Authorization:"Bearer "+token}});
  var data = await res.json();
  if (data.error) return showAlert(data.error, "error");
  showAlert("User deleted", "success");
  allUsers = allUsers.filter(u => u.id !== id);
  renderUsers(allUsers);
}

loadStats();
</script>
</body>
</html>
