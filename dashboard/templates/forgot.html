<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password – TraceQube</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/css/main.css"/>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-mark"><svg viewBox="0 0 15 15"><polyline points="2,12 5.5,5 9,9 12,5"/></svg></div>
      Trace<em>Qube</em>
    </div>
    <div class="auth-subtitle">Reset your password</div>
    <div id="alertBox"></div>
    <div class="form-group">
      <label class="form-label">Email address</label>
      <input class="input" type="email" id="email" placeholder="you@example.com" onkeydown="if(event.key==='Enter')submit()"/>
    </div>
    <button class="btn btn-primary" style="width:100%;margin-top:8px" onclick="submit()">Send Reset Link</button>
    <p style="text-align:center;margin-top:16px;font-size:0.78rem;color:var(--muted)">
      <a href="/" style="color:var(--accent)">← Back to Login</a>
    </p>
  </div>
</div>
<script>
const API = "https://api.traceqube.com";
async function submit() {
  var email = document.getElementById("email").value.trim();
  if (!email) return;
  var btn = document.querySelector(".btn-primary");
  btn.innerHTML = '<span class="spinner"></span> Sending'; btn.disabled = true;
  await fetch(API+"/api/forgot-password", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email})});
  btn.textContent = "Send Reset Link"; btn.disabled = false;
  document.getElementById("alertBox").innerHTML = '<div class="alert alert-success">If that email exists, a reset link has been sent.</div>';
}
var saved = localStorage.getItem("tq-theme") || "dark";
document.documentElement.setAttribute("data-theme", saved);
</script>
</body>
</html>
